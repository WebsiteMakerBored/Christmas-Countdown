<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Christmas Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#111111;--bg-2:#191919;--card:#202020;
  --green:#22C55E;--green-2:#86EFAC;
  --text:#F5F5F5;--text-2:#999999;--line:#303030;
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;--s6:48px;
  --r-sm:12px;--r:20px;--r-lg:28px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
button{font:inherit;color:inherit}

.wrap{max-width:640px;margin:0 auto;padding:0 var(--s3)}
nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo span{color:var(--green)}

.nav-r{display:flex;align-items:center;gap:var(--s1)}
.christmas-tag{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 15px;border:1px solid var(--green);border-radius:999px;background:rgba(34,197,94,.12);color:var(--green-2);font-size:13px;font-weight:600;letter-spacing:.02em;cursor:pointer;transition:background-color .2s,transform .15s}
.christmas-tag:hover{background:rgba(34,197,94,.2)}
.christmas-tag:active{transform:scale(.97)}
.visits{display:none;align-items:center;gap:var(--s1);height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg-2);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text);transition:border-color .2s}
.visits:hover{border-color:#464646}
.visits.show{display:inline-flex}
.visits .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:beat 2s ease-in-out infinite}
.visits em{font-style:normal;font-variant-numeric:tabular-nums}
.visits.wait em{color:var(--text-2)}
@keyframes beat{0%,100%{opacity:.35}50%{opacity:1}}

/* Platform selector */
.plat{position:relative}
.pbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg-2);color:var(--text);font:500 13px/1 var(--font);cursor:pointer;transition:border-color .2s,background-color .2s,transform .15s}
.pbtn:hover{border-color:#464646}
.pbtn:active{transform:scale(.97)}
.pbtn[aria-expanded="true"]{border-color:var(--green)}
.pbtn svg{width:16px;height:16px}
.pbtn.has .pad{color:var(--green)}
.pbtn .chev{color:var(--text-2);transition:transform .2s var(--ease)}
.pbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:200px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .18s var(--ease),transform .18s var(--ease),visibility 0s .18s;z-index:20}
.menu.open{opacity:1;visibility:visible;transform:none;transition:opacity .18s var(--ease),transform .18s var(--ease),visibility 0s}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--text);font:500 14px/1 var(--font);text-align:left;cursor:pointer;transition:background-color .15s,color .15s}
.opt+.opt{margin-top:2px}
.opt:hover{background:rgba(255,255,255,.05)}
.opt:focus-visible{outline-offset:-2px}
.opt svg{opacity:0;transition:opacity .15s}
.opt[aria-checked="true"]{background:rgba(34,197,94,.14);color:var(--green-2)}
.opt[aria-checked="true"] svg{opacity:1}

.guide{display:none;margin-top:var(--s1);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2)}
.guide.show{display:block;animation:rise .35s var(--ease) both}
.g-head{display:flex;align-items:center;gap:var(--s1)}
.g-title{font-weight:600;font-size:16px;margin-right:auto}
.chip{height:24px;padding:0 10px;display:inline-flex;align-items:center;border-radius:999px;background:rgba(34,197,94,.14);color:var(--green-2);font-size:12px;font-weight:600}
.guide .ibtn{width:32px;height:32px;border:0}
.g-times{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1);margin:12px 0}
.g-time{background:var(--bg-2);border-radius:var(--r-sm);padding:12px}
.g-time small{display:block;font-size:12px;color:var(--text-2)}
.g-time b{display:block;margin-top:2px;font-size:14px;font-weight:500}
.g-time span{display:block;margin-top:2px;font-size:12px;color:var(--text-2)}
.g-lead{margin:0 0 12px;font-size:14px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:14px}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;margin-top:-1px;border-radius:50%;background:rgba(34,197,94,.14);color:var(--green-2);font-size:12px;font-weight:600;display:grid;place-items:center}
.g-note{margin:12px 0 0;font-size:13px;color:var(--text-2)}
@media(max-width:480px){.g-times{grid-template-columns:1fr}.pbtn .lbl{max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.rise{animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Hero */
.hero{margin-top:var(--s2);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s2);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.select{position:relative;display:flex;align-items:center}
.select select{width:100%;appearance:none;-webkit-appearance:none;height:44px;padding:0 44px 0 var(--s2);font:500 15px/1 var(--font);color:var(--text);background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;transition:border-color .2s,background-color .2s}
.select select:hover{border-color:#464646}
.select select:focus-visible{outline-offset:2px}
.select svg{position:absolute;right:16px;color:var(--text-2);pointer-events:none}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s1);margin:var(--s3) 0 var(--s1);text-align:center}
.unit b{display:block;font-weight:600;font-size:clamp(36px,10vw,52px);line-height:1.05;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.unit span{display:block;margin-top:4px;font-size:12px;font-weight:500;color:var(--text-2)}
.unit.s b{color:var(--green)}
.live{display:none;text-align:center;padding:var(--s4) 0 var(--s2)}
.live strong{font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--green)}

/* List */
.head{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin:var(--s4) 0 var(--s1)}
h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.ibtn{width:40px;height:40px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);border-radius:50%;color:var(--text-2);cursor:pointer;transition:color .2s,border-color .2s,background-color .2s,transform .15s}
.ibtn:hover:not(:disabled){color:var(--text);border-color:#464646;background:var(--bg-2)}
.ibtn:active:not(:disabled){transform:scale(.94)}
.ibtn:disabled{opacity:.35;cursor:not-allowed}
.search{position:relative;display:flex;align-items:center;margin-bottom:var(--s1)}
.search>svg{position:absolute;left:16px;color:var(--text-2);pointer-events:none}
.search input{width:100%;height:44px;padding:0 48px 0 44px;font:400 15px/1 var(--font);color:var(--text);background:var(--bg-2);border:1px solid var(--line);border-radius:999px;transition:border-color .2s}
.search input::placeholder{color:var(--text-2)}
.search input:hover{border-color:#464646}
.search input::-webkit-search-cancel-button{display:none}
.search .ibtn{position:absolute;right:6px;width:36px;height:36px;border:0}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:var(--s2);padding:12px var(--s2);border-top:1px solid var(--line);transition:background-color .2s;animation:rise .5s var(--ease) both}
.row:first-child{border-top:0}
.row:hover{background:rgba(255,255,255,.03)}
.row.sel{background:rgba(34,197,94,.10)}
.main{flex:1;min-width:0}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--text-2);margin-top:2px}
.end{text-align:right;flex:none}
.cd{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.row.on .cd{color:var(--green)}
.mine{font-size:13px;color:var(--text-2);margin-top:2px}

.skel{height:64px;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s2);border-top:1px solid var(--line)}
.skel:first-child{border-top:0}
.skel i{display:block;height:12px;border-radius:6px;background:var(--bg-2);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

.empty{display:none;flex-direction:column;align-items:center;gap:var(--s1);padding:var(--s6) var(--s3);text-align:center;color:var(--text-2)}
.empty svg{width:28px;height:28px;color:var(--green-2)}
.empty strong{color:var(--text);font-weight:500}
.btn{height:44px;padding:0 var(--s3);margin-top:var(--s1);background:var(--green);color:#111;border:0;border-radius:999px;font-weight:600;cursor:pointer;transition:background-color .2s,transform .15s}
.btn:hover{background:var(--green-2)}
.btn:active{transform:scale(.97)}

/* Modal */
dialog{width:min(92vw,420px);padding:var(--s3);background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 24px 64px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog[open]{animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
dialog h3{margin:0 0 var(--s1);font-size:18px;font-weight:600}
dialog p{margin:0 0 var(--s3);color:var(--text-2)}
dialog .btn{margin:0;width:100%}
#facts-dlg{width:min(92vw,460px)}
.bottom{height:var(--s4)}

@media(max-width:480px){
  .wrap{padding:0 var(--s2)}
  .hero{border-radius:var(--r)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pad" viewBox="0 0 24 24"><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
</svg>

<div class="wrap rise">
  <nav>
    <div class="logo">Merry <span>Christmas</span></div>
    <div class="nav-r">
      <div class="visits wait" id="visits" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><em id="vn">–</em><span>Visits</span></div>
      <button class="christmas-tag" id="facts-btn" type="button" aria-label="Christmas facts">Facts</button>
    </div>
  </nav>

  <main>
    <section class="hero" aria-label="Countdown to Christmas Day">
      <div class="select">
        <label class="sr" for="region">Region</label>
        <select id="region"></select>
        <svg class="i" aria-hidden="true"><use href="#chev"/></svg>
      </div>
      <div id="clock" class="clock" role="timer" aria-live="off">
        <div class="unit"><b id="d">–</b><span>Days</span></div>
        <div class="unit"><b id="h">––</b><span>Hours</span></div>
        <div class="unit"><b id="m">––</b><span>Minutes</span></div>
        <div class="unit s"><b id="s">––</b><span>Seconds</span></div>
      </div>
      <div id="live" class="live"><strong>Merry Christmas</strong></div>
    </section>



    <div class="head">
      <h2>Christmas countdown by region</h2>
      <button class="ibtn" id="info" type="button" aria-label="About these times"><svg class="i" aria-hidden="true"><use href="#info"/></svg></button>
    </div>

    <div class="search">
      <svg class="i" aria-hidden="true"><use href="#search"/></svg>
      <label class="sr" for="q">Search countries</label>
      <input id="q" type="search" placeholder="Search countries" autocomplete="off">
      <button class="ibtn" id="clear" type="button" aria-label="Clear search" disabled><svg class="i" aria-hidden="true"><use href="#x"/></svg></button>
    </div>

    <div class="list" id="listbox">
      <div id="skeleton" aria-hidden="true"></div>
      <div id="list" style="display:none"></div>
      <div class="empty" id="empty">
        <svg class="i" aria-hidden="true"><use href="#search"/></svg>
        <strong id="empty-t">No results</strong>
        <button class="btn" id="empty-clear" type="button">Clear search</button>
      </div>
    </div>
  </main>
  <div class="bottom"></div>
</div>

<dialog id="dlg" aria-labelledby="dlg-t">
  <h3 id="dlg-t">Release times</h3>
  <p>Christmas Day begins at midnight local time in each region.</p>
  <button class="btn" id="dlg-close" type="button">Got it</button>
</dialog>

<dialog id="facts-dlg" aria-labelledby="facts-t">
  <h3 id="facts-t">Christmas Facts</h3>
  <div id="facts-content" style="max-height:50vh;overflow-y:auto;margin-bottom:16px;font-size:14px;line-height:1.55;color:var(--text-2)"></div>
  <button class="btn" id="facts-close" type="button">Close</button>
</dialog>

<script>
(function(){
  var BASE=Date.UTC(2026,11,25,0,0,0);
  var R=[
    ["New Zealand",13,"12:00 AM NZDT"],
    ["Australia",11,"12:00 AM AEDT"],
    ["Japan",9,"12:00 AM JST"],
    ["South Korea",9,"12:00 AM KST"],
    ["Philippines",8,"12:00 AM PHT"],
    ["Singapore",8,"12:00 AM SGT"],
    ["India",5.5,"12:00 AM IST"],
    ["United Arab Emirates",4,"12:00 AM GST"],
    ["Saudi Arabia",3,"12:00 AM AST"],
    ["Türkiye",3,"12:00 AM TRT"],
    ["South Africa",2,"12:00 AM SAST"],
    ["Germany",1,"12:00 AM CET"],
    ["France",1,"12:00 AM CET"],
    ["Italy",1,"12:00 AM CET"],
    ["Spain",1,"12:00 AM CET"],
    ["Netherlands",1,"12:00 AM CET"],
    ["Poland",1,"12:00 AM CET"],
    ["Sweden",1,"12:00 AM CET"],
    ["United Kingdom",0,"12:00 AM GMT"],
    ["Ireland",0,"12:00 AM GMT"],
    ["Portugal",0,"12:00 AM WET"],
    ["Brazil",-3,"12:00 AM BRT"],
    ["Argentina",-3,"12:00 AM ART"],
    ["Chile",-3,"12:00 AM CLST"],
    ["United States",-5,"12:00 AM ET · 9:00 PM PT, Nov 18"],
    ["Canada",-5,"12:00 AM ET"],
    ["Colombia",-5,"12:00 AM COT"],
    ["Mexico",-6,"12:00 AM CST"]
  ];
  R.forEach(function(r){r.t=BASE-r[1]*3600000;});
  R.sort(function(a,b){return a.t-b.t;});

  var $=function(i){return document.getElementById(i)};
  var tz;try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}
  function fmtMine(t){
    try{return new Intl.DateTimeFormat(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZoneName:"short"}).format(new Date(t));}
    catch(e){return new Date(t).toString();}
  }
  function pad(n){return n<10?"0"+n:""+n}
  function parts(ms){var s=Math.floor(ms/1000);return{d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60}}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

  var sk=$("skeleton");
  for(var k=0;k<6;k++){
    var s=el("div","skel");
    var a=el("i");a.style.width="40%";
    var sp=el("div");sp.style.flex="1";sp.appendChild(a);
    var b=el("i");b.style.width="72px";
    s.appendChild(sp);s.appendChild(b);sk.appendChild(s);
  }

  var sel=$("region"),list=$("list"),rows=[];
  R.forEach(function(r,i){
    var o=el("option",null,r[0]);o.value=i;sel.appendChild(o);
    var row=el("div","row");row.style.animationDelay=Math.min(i*20,300)+"ms";
    var main=el("div","main");
    main.appendChild(el("div","name",r[0]));
    main.appendChild(el("div","sub",r[2]));
    var end=el("div","end");
    var cd=el("div","cd");
    end.appendChild(cd);
    end.appendChild(el("div","mine",fmtMine(r.t)));
    row.appendChild(main);row.appendChild(end);
    list.appendChild(row);
    rows.push({el:row,cd:cd,name:r[0].toLowerCase()});
  });

  var off=-new Date(BASE).getTimezoneOffset()/60,pick=-1;
  if(tz&&tz.indexOf("America/")===0&&off<=-5&&off>=-8){pick=R.findIndex(function(r){return r[0]==="United States"});}
  if(pick<0){pick=R.findIndex(function(r){return r[1]===off});}
  if(pick<0){pick=R.findIndex(function(r){return r[0]==="United States"});}
  sel.value=pick;

  function setWhen(){
    rows.forEach(function(x,i){x.el.classList.toggle("sel",i===+sel.value)});
  }
  sel.addEventListener("change",function(){setWhen();tick();if(typeof renderGuide==="function")renderGuide();});

  function tick(){
    var now=Date.now(),r=R[sel.value],diff=r.t-now;
    if(diff<=0){$("clock").style.display="none";$("live").style.display="block";}
    else{
      $("clock").style.display="";$("live").style.display="none";
      var p=parts(diff);
      $("d").textContent=p.d;$("h").textContent=pad(p.h);$("m").textContent=pad(p.m);$("s").textContent=pad(p.s);
    }
    R.forEach(function(r,i){
      var df=r.t-now,x=rows[i];
      if(df<=0){x.el.classList.add("on");x.cd.textContent="Live now";}
      else{
        x.el.classList.remove("on");
        var p=parts(df);
        x.cd.textContent=(p.d>0?p.d+"d ":"")+pad(p.h)+":"+pad(p.m)+":"+pad(p.s);
      }
    });
  }

  var q=$("q"),clear=$("clear");
  function filter(){
    var v=q.value.trim().toLowerCase(),n=0;
    rows.forEach(function(x){var show=!v||x.name.indexOf(v)>-1;x.el.style.display=show?"":"none";if(show)n++;});
    clear.disabled=!q.value;
    $("empty").style.display=n===0?"flex":"none";
    if(n===0)$("empty-t").textContent="No results for “"+q.value.trim()+"”";
  }
  function reset(){q.value="";filter();q.focus();}
  q.addEventListener("input",filter);
  clear.addEventListener("click",reset);
  $("empty-clear").addEventListener("click",reset);
  q.addEventListener("keydown",function(e){if(e.key==="Escape"&&q.value)reset();});

  var dlg=$("dlg");
  $("info").addEventListener("click",function(){if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");});
  $("dlg-close").addEventListener("click",function(){dlg.close();});
  dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close();});

  // Christmas facts modal
  var FACTS={
    "United States":[
      "The modern American image of Santa Claus was heavily shaped in New York. Clement Clarke Moore’s 1823 poem “A Visit from St. Nicholas” (better known as ’Twas the Night Before Christmas) popularized the jolly, reindeer-driving Santa.",
      "The first electrically lit Christmas tree was created in New York City in 1882 by Edward H. Johnson, a colleague of Thomas Edison.",
      "The Rockefeller Center Christmas Tree tradition began in the 1930s and has become one of the most iconic holiday symbols in the United States.",

  function getFacts(country){
    if(FACTS[country]) return FACTS[country];
    return FACTS["default"];
  }

  function showFacts(){
    var country=R[+sel.value][0];
    var list=getFacts(country);
    var html="<p style='margin:0 0 12px;color:var(--text);font-weight:500'>"+country+"</p><ul style='margin:0;padding-left:18px'>";
    list.forEach(function(f){html+="<li style='margin-bottom:10px'>"+f+"</li>";});
    html+="</ul>";
    if(country==="United States"){
      html+="<p style='margin:14px 0 0;font-size:12px;color:var(--text-2)'>Facts drawn from historical accounts and reporting commonly covered by outlets including The New York Times.</p>";
    }
    $("facts-content").innerHTML=html;
    var fd=$("facts-dlg");
    if(fd.showModal)fd.showModal();else fd.setAttribute("open","");
  }

  $("facts-btn").addEventListener("click",showFacts);
  $("facts-close").addEventListener("click",function(){$("facts-dlg").close();});
  $("facts-dlg").addEventListener("click",function(e){if(e.target===$("facts-dlg"))$("facts-dlg").close();});

  // Visitor counter, backed by GoatCounter (real analytics, stored by their servers).
  // Set GC_CODE to your GoatCounter site code, e.g. "gta6countdown" for gta6countdown.goatcounter.com
  var GC_CODE="";
  if(GC_CODE){
    var vEl=$("visits"),vn=$("vn");
    vEl.classList.add("show");
    var sc=document.createElement("script");
    sc.async=true;sc.src="https://gc.zgo.at/count.js";
    sc.setAttribute("data-goatcounter","https://"+GC_CODE+".goatcounter.com/count");
    document.head.appendChild(sc);
    setTimeout(function(){
      fetch("https://"+GC_CODE+".goatcounter.com/counter/TOTAL.json")
        .then(function(r){if(!r.ok)throw 0;return r.json();})
        .then(function(d){
          var n=parseInt(String(d.count_unique).replace(/\D/g,""),10);
          if(isNaN(n))throw 0;
          vn.textContent=n.toLocaleString();vEl.classList.remove("wait");
        })
        .catch(function(){vEl.title="Visit count unavailable right now";});
    },1500);
  }

  setWhen();tick();filter();setInterval(tick,1000);
  setTimeout(function(){sk.style.display="none";list.style.display="";},450);
})();
</script>
